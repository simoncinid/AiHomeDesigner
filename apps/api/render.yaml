services:
  - type: web
    name: ai-homedesigner-api
    env: python
    buildCommand: CARGO_HOME=/tmp/cargo RUSTUP_HOME=/tmp/rustup pip install --no-cache-dir -r requirements.txt
    startCommand: alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port $PORT --log-level info --access-log
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CA_FILE
        sync: false
      - key: WAVESPEED_API_KEY
        sync: false
      - key: IP_SALT
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: SITE_URL
        value: https://www.ai-homedesigner.com
      - key: RESEND_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        value: https://ai-homedesigner.com,https://www.ai-homedesigner.com,https://*.vercel.app
